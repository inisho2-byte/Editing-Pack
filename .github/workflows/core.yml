name: Core and privacy checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-core:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.9'
      - name: Install locked core dependencies
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: -r requirements-core.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Core install failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency consistency failed' }
      - name: Install checksum-pinned verification tools externally
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $VerifyTools = Join-Path $env:RUNNER_TEMP 'editing-pack-tools'
          New-Item -ItemType Directory -Path $VerifyTools -Force | Out-Null
          $VerifyZip = Join-Path $VerifyTools 'ffmpeg.zip'
          Invoke-WebRequest 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-full_build.zip' -OutFile $VerifyZip
          if ((Get-FileHash -LiteralPath $VerifyZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '759d0a9831c436a0eb331ad36f236c06cb04aaa0005da46571f0e9d3d9206f6b') { throw 'FFmpeg checksum mismatch' }
          Expand-Archive -LiteralPath $VerifyZip -DestinationPath $VerifyTools
          "EDITING_PACK_FFMPEG=$(Join-Path $VerifyTools 'ffmpeg-9.0.2-full_build/bin/ffmpeg.exe')" >> $env:GITHUB_ENV
          "EDITING_PACK_FFPROBE=$(Join-Path $VerifyTools 'ffmpeg-9.0.2-full_build/bin/ffprobe.exe')" >> $env:GITHUB_ENV
          $ScanZip = Join-Path $VerifyTools 'gitleaks.zip'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $ScanZip
          if ((Get-FileHash -LiteralPath $ScanZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks checksum mismatch' }
          Expand-Archive -LiteralPath $ScanZip -DestinationPath (Join-Path $VerifyTools 'gitleaks')
          "EDITING_PACK_SCANNER=$(Join-Path $VerifyTools 'gitleaks/gitleaks.exe')" >> $env:GITHUB_ENV
      - name: Check source privacy and local links
        shell: pwsh
        run: |
          python -B scripts/check_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Source checks failed' }
          $ScanConfig = Join-Path $env:RUNNER_TEMP 'editing-pack-gitleaks.toml'
          "[extend]`nuseDefault = true" | Set-Content -LiteralPath $ScanConfig -Encoding utf8NoBOM
          & $env:EDITING_PACK_SCANNER dir . --config $ScanConfig --redact=100 --ignore-gitleaks-allow --gitleaks-ignore-path (Join-Path $env:RUNNER_TEMP 'absent-gitleaks-ignore') --max-decode-depth 5 --max-archive-depth 3
          if ($LASTEXITCODE -ne 0) { throw 'Secret scan failed' }
      - name: Run core checks and synthetic walkthrough
        shell: pwsh
        run: |
          $VerifyWorkspace = Join-Path $env:RUNNER_TEMP 'editing-pack-workspace'
          python -B scripts/run_checks.py --workspace $VerifyWorkspace
          if ($LASTEXITCODE -ne 0) { throw 'Core checks failed' }
          python -B scripts/synthetic_walkthrough.py --workspace $VerifyWorkspace
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic walkthrough failed' }
